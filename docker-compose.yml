services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: open_health_server
      POSTGRES_USER: ohs
      POSTGRES_PASSWORD: ohs
    ports:
      - "5433:5432"
    volumes:
      - ohs_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohs -d open_health_server"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OHS_APP_NAME: open-health-server
      OHS_ENVIRONMENT: development
      OHS_API_VERSION: 0.1.0
      OHS_DATABASE_URL: postgresql+psycopg://ohs:ohs@db:5432/open_health_server
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ohs_db_data:
